version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lambe-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: lambe_db
    ports:
      - "5433:5432"
    volumes:
      - lambe_postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: lambe-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lambe.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "8080:80"
    depends_on:
      - postgres

  lambe_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lambe_server
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres_password
      DB_NAME: lambe_db
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/lambe_db?schema=public
    depends_on:
      - postgres

volumes:
  lambe_postgres_data:
