services:
  postgres:
    image: postgres:16-alpine
    container_name: lambe-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: lambe_db
    ports:
      - '5433:5432'
    volumes:
      - lambe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lambe_db']
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: lambe-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lambe.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - '8080:80'
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: lambe-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - lambe_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/lambe_db?schema=public
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  lambe_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lambe_server
    restart: always
    env_file:
      - .env
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres_password
      DB_NAME: lambe_db
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/lambe_db?schema=public
      REDIS_ENABLED: 'true'
      REDIS_URL: redis://redis:6379
    command: ['node', 'dist/src/main']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  lambe_postgres_data:
  lambe_redis_data:
