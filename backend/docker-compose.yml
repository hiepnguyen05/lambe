name: lambe

services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ['routing']
    command: ['osrm-routed', '--algorithm', 'mld', '/data/vietnam-latest.osrm']
    volumes:
      - ./routing-data:/data:ro
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - .env
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'

  lambe_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lambe_server
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: always
    env_file:
      - .env
    environment:
      OSRM_URL: http://osrm:5000
    ports:
      - '${LAMBE_API_HOST_PORT:-5000}:5000'
    command: ['node', 'dist/src/main']
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5000/api/health').then(async r=>{const b=await r.json();if(!r.ok||b.data?.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  ops_monitor:
    build:
      context: .
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: always
    env_file:
      - .env
    environment:
      MONITOR_HEALTH_URL: http://lambe_server:5000/api/health
    command: ['node', 'scripts/monitor-health.mjs']
